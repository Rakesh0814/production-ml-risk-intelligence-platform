apiVersion: apps/v1
kind: Deployment
metadata:
  name: risklens-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: risklens-api
  template:
    metadata:
      labels:
        app: risklens-api
    spec:
      containers:
        - name: risklens-api
          image: ghcr.io/OWNER/production-ml-risk-intelligence-platform:latest
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
