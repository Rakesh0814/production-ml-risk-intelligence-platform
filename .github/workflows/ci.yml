name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pandas numpy scikit-learn xgboost shap pytest httpx

      - name: Run tests
        env:
        PYTHONPATH: .
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t risklens-api .
